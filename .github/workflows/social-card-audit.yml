name: Social card crawler audit
on:
  pull_request:
    paths:
      - 'scripts/social-card-audit.mjs'
      - '.github/workflows/social-card-audit.yml'
      - 'public/index.html'
      - 'public/social-card.png'
      - 'public/_headers'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  twitterbot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe live social preview as Twitterbot
        run: node scripts/social-card-audit.mjs
      - name: Inspect PNG transparency and content
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image, ImageStat, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          im=Image.open("public/social-card.png")
          print(f"PNG_DETAILS: mode={im.mode}, size={im.size}, transparency={im.info.get('transparency', 'none')}")
          rgba=im.convert('RGBA')
          alpha=rgba.getchannel('A')
          print(f"ALPHA_EXTREMA: {alpha.getextrema()} | VISIBLE_BOUNDS: {alpha.getbbox()}")
          from PIL import ImageChops
          white=Image.new('RGB', im.size, 'white')
          white.paste(rgba, mask=alpha)
          print(f"IMAGE_CONTRAST: {ImageStat.Stat(white).extrema}")
          print(f"UNIQUE_COLORS: {len(set(white.getdata()))}")
          print(f"COLOR_SAMPLES: {white.getpixel((0,0))}, {white.getpixel((600,315))}, {white.getpixel((1100,500))}")
          print(f"NON_WHITE_BOUNDS: {ImageChops.difference(white, Image.new('RGB',im.size,'white')).getbbox()}")
          PY
